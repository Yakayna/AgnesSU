name: Compile Check

# Manual-only compile gate: builds the manager's Kotlin without uploading any
# artifact, so it also works when the GitHub Actions artifact storage quota is
# exhausted (the full Build Manager pipeline needs artifact uploads).
on:
  workflow_dispatch:

jobs:
  compile-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" >/dev/null || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370"

      - name: Compile manager Kotlin
        working-directory: manager
        run: ./gradlew :app:compileDebugKotlin --console=plain --stacktrace
